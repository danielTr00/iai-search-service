name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q src
      - run: python -m pytest
      - run: docker compose config
        env:
          SEARCH_API_TOKEN: ci-placeholder-token-at-least-twenty-characters
      - run: docker build -t iai-search-service:ci .
