use_default_settings:
  engines:
    remove:
      - ahmia
      - duckduckgo
      - torch
      - brave
      - google cse
      - wikipedia
      - wikidata

engines:
  - name: bing
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false

general:
  instance_name: "iAi Search"
  debug: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  secret_key: "internal-only-no-public-router"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  pool_connections: 20
  pool_maxsize: 8
