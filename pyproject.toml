[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "iai-search-service"
version = "0.1.0"
description = "Self-hosted web research service for iAi Agent Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.11.0",
  "trafilatura==2.2.0",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iai_search_service"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
