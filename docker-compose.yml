services:
  search-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SEARCH_API_TOKEN: ${SEARCH_API_TOKEN:?set SEARCH_API_TOKEN}
      SEARCH_SEARXNG_URL: http://searxng:8080
      SEARCH_MAX_CONCURRENT_REQUESTS: ${SEARCH_MAX_CONCURRENT_REQUESTS:-2}
    depends_on:
      searxng:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SEARCH_PORT:-8090}:8080"
    networks: [searchnet]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "1000:1000"
    mem_limit: ${SEARCH_API_MEMORY:-512m}
    cpus: ${SEARCH_API_CPUS:-0.75}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  searxng:
    image: docker.io/searxng/searxng@sha256:205e303efc8b3fd024ba67f43376e16212a4a21a561de008f22ae07411e9d3ab
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    expose: ["8080"]
    networks: [searchnet]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/searxng]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${SEARXNG_MEMORY:-768m}
    cpus: ${SEARXNG_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  searchnet:
    driver: bridge
