services:
  search-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SEARCH_API_TOKEN: ${SEARCH_API_TOKEN:?set SEARCH_API_TOKEN}
      SEARCH_SEARXNG_URL: http://searxng:8080
      SEARCH_MAX_CONCURRENT_REQUESTS: ${SEARCH_MAX_CONCURRENT_REQUESTS:-2}
      SEARCH_SOURCE_CACHE_TTL_SECONDS: ${SEARCH_SOURCE_CACHE_TTL_SECONDS:-21600}
      SEARCH_SOURCE_CACHE_MAX_ENTRIES: ${SEARCH_SOURCE_CACHE_MAX_ENTRIES:-256}
      SEARCH_SOURCE_CACHE_MAX_BYTES: ${SEARCH_SOURCE_CACHE_MAX_BYTES:-16000000}
      SEARCH_QUERY_CACHE_TTL_SECONDS: ${SEARCH_QUERY_CACHE_TTL_SECONDS:-300}
      SEARCH_QUERY_CACHE_MAX_ENTRIES: ${SEARCH_QUERY_CACHE_MAX_ENTRIES:-128}
      SEARCH_QUERY_CACHE_MAX_BYTES: ${SEARCH_QUERY_CACHE_MAX_BYTES:-2000000}
    depends_on:
      searxng:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SEARCH_PORT:-8090}:8080"
    networks: [searchnet]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "1000:1000"
    mem_limit: ${SEARCH_API_MEMORY:-512m}
    cpus: ${SEARCH_API_CPUS:-0.75}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  searxng:
    image: docker.io/searxng/searxng@sha256:205e303efc8b3fd024ba67f43376e16212a4a21a561de008f22ae07411e9d3ab
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      IAI_SETTINGS_REVISION: "2026-09-23-1"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    expose: ["8080"]
    networks: [searchnet]
    restart: unless-stopped
    # The official entrypoint updates the CA store and fixes cache ownership
    # before dropping privileges, so this container cannot be read-only or
    # stripped of CHOWN/SETUID capabilities during startup.
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: ${SEARXNG_MEMORY:-768m}
    cpus: ${SEARXNG_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8080/', headers={'X-Forwarded-For':'127.0.0.1'}); urllib.request.urlopen(request, timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  deployment-benchmark:
    image: python:3.13-alpine
    command: ["python", "/benchmark.py"]
    environment:
      SEARCH_API_TOKEN: ${SEARCH_API_TOKEN:?set SEARCH_API_TOKEN}
      SEARCH_BENCHMARK_URL: http://search-api:8080/v1/research
    volumes:
      - ./scripts/deployment_benchmark.py:/benchmark.py:ro
    depends_on:
      search-api:
        condition: service_healthy
    networks: [searchnet]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "2m", max-file: "2"}

networks:
  searchnet:
    name: iai-research-net
    driver: bridge
